  <rect x="90" y="164" width="18" height="7" rx="3.5" fill="#2C3646"/>

  <!-- wordmark -->
  <text x="168" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54" font-weight="600" letter-spacing="-1">
    <tspan fill="#EAF0F7">tell</tspan><tspan fill="#E8B339">sign</tspan>
  </text>
  <text x="171" y="187" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#7C899B">names the tell in machine-written JavaScript</text>

