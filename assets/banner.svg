  <text x="330" y="230" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#AEBBCB">zero dependencies</text>
  <rect x="476" y="210" width="112" height="30" rx="8" fill="#141A24" stroke="#232C3A"/>
  <text x="492" y="230" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#AEBBCB">14 families</text>

  <!-- panel: source with its strings and comments masked out, one line flagged -->
  <rect x="668" y="48" width="468" height="204" rx="12" fill="#0E131B" stroke="#1E2632"/>
  <text x="692" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#57637A">src/billing.js</text>

