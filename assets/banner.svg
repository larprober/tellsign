<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="tellsign - names the tell in machine-written JavaScript">
  <rect x="0" y="0" width="1200" height="300" rx="18" fill="#0B0E14"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="17.5" fill="none" stroke="#1B2230"/>

  <!-- mark: three lines of code, one of them flagged -->
